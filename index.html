
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Kalkulator i Szkicownik Funkcji PRO</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
  <style>
    :root {
      --bg-main: #0a0a0a;
      --bg-panel: #1e1e1e;
      --bg-graph: #13151c;
      --text-main: #ffffff;
      --text-muted: #888888;
      --accent-blue: #3b82f6;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
    }
    
    * { box-sizing: border-box; }
    
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      /* Pozwól na normalne scrollowanie całej strony */
      overflow-y: auto; 
    }
    
    .app-container {
      width: 100%;
      max-width: 420px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      padding-bottom: 40px;
    }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 18px;
    }

    .mode-switch {
      display: flex;
      background: #222;
      border-radius: 10px;
      padding: 3px;
      gap: 3px;
    }
    .mode-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
    }
    .mode-btn.active {
      background: var(--accent-blue);
      color: white;
    }
    
    .graph-container {
      width: 100%;
      aspect-ratio: 1;
      background-color: var(--bg-graph);
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }
    
    canvas {
      width: 100%;
      height: 100%;
      border-radius: 12px;
      cursor: grab;
      display: block;
      /* Blokujemy domyślne gesty tylko na samym canvasie do rysowania/przesuwania wykresu */
      touch-action: none; 
    }
    canvas:active { cursor: grabbing; }

    .graph-controls {
      position: absolute;
      bottom: 10px;
      right: 10px;
      display: flex;
      gap: 6px;
      z-index: 10;
    }

    .graph-exit-fs {
      position: absolute;
      top: 10px;
      right: 10px;
      display: none;
      gap: 6px;
      z-index: 10;
    }
    body.fullscreen-mode .graph-exit-fs { display: flex; }

    .graph-btn {
      background: rgba(42, 45, 58, 0.85);
      border: 1px solid #444;
      color: white;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      backdrop-filter: blur(4px);
      user-select: none;
    }
    .graph-btn:active { background: rgba(59, 130, 246, 0.8); }
    
    .panel {
      background-color: var(--bg-panel);
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .control-label {
      width: 90px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
    }
    
    .input-field, .select-func {
      background: #2a2a2a;
      border: 1px solid #333;
      color: white;
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 8px;
      outline: none;
      flex-grow: 1;
      margin-left: 10px;
    }
    .input-field.error { border-color: var(--accent-red); color: var(--accent-red); }
    .select-func { cursor: pointer; appearance: none; }
    
    .slider-container { display: flex; flex-direction: column; gap: 12px; }
    .slider-wrapper { flex-grow: 1; margin: 0 10px; display: flex; align-items: center; }
    
    input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; height: 18px; width: 6px; border-radius: 2px; background: #ffffff; cursor: pointer; margin-top: -8px;
    }
    input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 2px; background: #555; border-radius: 1px; }
    
    .val-box {
      background-color: #2a2a2a; padding: 6px 0; border-radius: 10px; width: 40px; text-align: center; font-size: 13px; font-weight: 500;
    }

    /* Własności funkcji (Analiza) */
    .properties-box {
      background: #15171e;
      border: 1px solid #2a2d3a;
      border-radius: 12px;
      padding: 12px;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .prop-title { font-weight: 600; color: var(--accent-blue); margin-bottom: 2px; font-size: 13px; }
    .prop-item { display: flex; justify-content: space-between; color: #ccc; }
    .prop-val { font-weight: 600; color: white; }

    /* Tryb Szkicownika */
    .sketch-task {
      font-size: 13px;
      font-weight: 600;
      color: #fbbf24;
      background: rgba(251, 191, 36, 0.1);
      padding: 10px;
      border-radius: 8px;
      border: 1px solid rgba(251, 191, 36, 0.3);
      text-align: center;
    }
    .action-btn {
      background: var(--accent-blue);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
    .action-btn:active { opacity: 0.8; }
    .sketch-feedback {
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      padding: 8px;
      border-radius: 8px;
      display: none;
    }
    .sketch-feedback.success { background: rgba(34, 197, 94, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
    .sketch-feedback.error { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }

    body.fullscreen-mode .panel,
    body.fullscreen-mode .header { display: none !important; }
    body.fullscreen-mode { background-color: var(--bg-graph); padding: 0; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    body.fullscreen-mode .app-container { max-width: 100% !important; height: 100vh; padding: 0; margin: 0; justify-content: center; }
    body.fullscreen-mode .graph-container { width: 100vw; height: 100vh; aspect-ratio: unset; border-radius: 0; margin: 0; }
  </style>
</head>
<body>

<div class="app-container" id="app-container">
  <div class="header">
    <div style="cursor:pointer">←</div>
    <div class="mode-switch">
      <button class="mode-btn active" id="mode-calc" onclick="switchMode('calc')">Kalkulator</button>
      <button class="mode-btn" id="mode-sketch" onclick="switchMode('sketch')">Szkicownik</button>
    </div>
    <div style="cursor:pointer; font-size:18px;" id="btn-fullscreen" title="Pełny ekran">⛶</div>
  </div>

  <div class="graph-container" id="graph-container">
    <canvas id="graph" width="400" height="400"></canvas>
    
    <div class="graph-controls">
      <div class="graph-btn" id="btn-zoom-in" title="Przybliż">+</div>
      <div class="graph-btn" id="btn-zoom-out" title="Oddal">-</div>
      <div class="graph-btn" id="btn-center" title="Wyśrodkuj">⌖</div>
    </div>

    <div class="graph-exit-fs">
      <div class="graph-btn" id="btn-exit-fs" title="Wyjdź z pełnego ekranu">✕</div>
    </div>
  </div>

  <!-- PANEL KALKULATORA (Własności) -->
  <div class="panel" id="panel-calc">
    <div class="control-row">
      <span class="control-label">Tryb</span>
      <select id="transform-type" class="select-func">
        <option value="vector">Przesunięcie wektor [p, q]</option>
        <option value="symX">Symetria OX: -f(x)</option>
        <option value="symY">Symetria OY: f(-x)</option>
        <option value="sym00">Symetria (0,0): -f(-x)</option>
        <option value="absF">Wartość bezwzgl: |f(x)|</option>
        <option value="absX">Wartość bezwzgl arg: f(|x|)</option>
      </select>
    </div>

    <div class="control-row">
      <span class="control-label">f(x) =</span>
      <input type="text" class="input-field" id="fx-input" value="x + 2">
    </div>
    
    <div id="vector-sliders" class="slider-container">
      <div class="control-row">
        <span class="control-label">Przes. X (p)</span>
        <div class="slider-wrapper">
          <input type="range" id="p-slider" min="-20" max="20" step="0.5" value="0">
        </div>
        <div class="val-box" id="p-val">0</div>
      </div>

      <div class="control-row">
        <span class="control-label">Przes. Y (q)</span>
        <div class="slider-wrapper">
          <input type="range" id="q-slider" min="-20" max="20" step="0.5" value="0">
        </div>
        <div class="val-box" id="q-val">0</div>
      </div>
    </div>

    <!-- Automatyczne własności funkcji -->
    <div class="properties-box">
      <div class="prop-title">📊 Odczyt własności z wykresu</div>
      <div class="prop-item"><span>Dziedzina:</span> <span class="prop-val" id="prop-domain">D = ℝ</span></div>
      <div class="prop-item"><span>Zbiór wartości:</span> <span class="prop-val" id="prop-range">ZW = ℝ</span></div>
      <div class="prop-item"><span>Miejsce zerowe (x₀):</span> <span class="prop-val" id="prop-zero">-</span></div>
      <div class="prop-item"><span>Przecięcie OY (0, y):</span> <span class="prop-val" id="prop-oy">-</span></div>
      <div class="prop-item"><span>Monotoniczność:</span> <span class="prop-val" id="prop-mono">Rosnąca</span></div>
    </div>
  </div>

  <!-- PANEL SZKICOWNIKA (Sprawdzanie zadania) -->
  <div class="panel" id="panel-sketch" style="display: none;">
    <div class="sketch-task" id="sketch-task-text">Zadanie: Naszkicuj funkcję g(x) dla f(x) = x i wektora [2, 1]</div>
    
    <div class="control-row">
      <span class="control-label">Miejsce zerowe</span>
      <input type="text" class="input-field" id="sketch-zero" placeholder="np. -1 lub brak">
    </div>
    <div class="control-row">
      <span class="control-label">Punkt OY</span>
      <input type="text" class="input-field" id="sketch-oy" placeholder="np. 3">
    </div>

    <button class="action-btn" onclick="checkSketchAnswer()">Sprawdź odpowiedź</button>
    <div class="sketch-feedback" id="sketch-feedback"></div>
    <button class="action-btn" style="background: #333; margin-top: -4px;" onclick="generateNewSketchTask()">Nowe zadanie</button>
  </div>
</div>

<script>
  const canvas = document.getElementById('graph');
  const ctx = canvas.getContext('2d');
  
  const els = {
    fx: document.getElementById('fx-input'),
    type: document.getElementById('transform-type'),
    p: document.getElementById('p-slider'),
    q: document.getElementById('q-slider'),
    pVal: document.getElementById('p-val'),
    qVal: document.getElementById('q-val'),
    btnCenter: document.getElementById('btn-center'),
    btnZoomIn: document.getElementById('btn-zoom-in'),
    btnZoomOut: document.getElementById('btn-zoom-out'),
    btnFullscreen: document.getElementById('btn-fullscreen'),
    btnExitFs: document.getElementById('btn-exit-fs'),
    graphContainer: document.getElementById('graph-container'),
    panelCalc: document.getElementById('panel-calc'),
    panelSketch: document.getElementById('panel-sketch'),
    modeCalc: document.getElementById('mode-calc'),
    modeSketch: document.getElementById('mode-sketch'),
    propDomain: document.getElementById('prop-domain'),
    propRange: document.getElementById('prop-range'),
    propZero: document.getElementById('prop-zero'),
    propOy: document.getElementById('prop-oy'),
    propMono: document.getElementById('prop-mono'),
    sketchTaskText: document.getElementById('sketch-task-text'),
    sketchZero: document.getElementById('sketch-zero'),
    sketchOy: document.getElementById('sketch-oy'),
    sketchFeedback: document.getElementById('sketch-feedback')
  };

  let view = { offsetX: 0, offsetY: 0, scale: 30 };
  let isDragging = false, lastX = 0, lastY = 0, initialPinchDist = null, initialScale = 30;
  let currentAppMode = 'calc';
  let currentSketchTask = null;

  function switchMode(mode) {
    currentAppMode = mode;
    if (mode === 'calc') {
      els.modeCalc.classList.add('active');
      els.modeSketch.classList.remove('active');
      els.panelCalc.style.display = 'flex';
      els.panelSketch.style.display = 'none';
      updateUI();
    } else {
      els.modeSketch.classList.add('active');
      els.modeCalc.classList.remove('active');
      els.panelSketch.style.display = 'flex';
      els.panelCalc.style.display = 'none';
      generateNewSketchTask();
    }
  }

  function resizeCanvasToDisplay() {
    const rect = els.graphContainer.getBoundingClientRect();
    if (canvas.width !== rect.width || canvas.height !== rect.height) {
      canvas.width = rect.width;
      canvas.height = rect.height;
      if (view.offsetX === 0 && view.offsetY === 0) {
        view.offsetX = canvas.width / 2;
        view.offsetY = canvas.height / 2;
      }
    }
  }

  function evaluateMath(expression, xVal) {
    try {
      let sanitizedExpr = expression.replace(/,/g, '.');
      let res = math.evaluate(sanitizedExpr, { x: xVal });
      els.fx.classList.remove('error');
      return res;
    } catch(e) {
      els.fx.classList.add('error');
      return null;
    }
  }

  function evaluateTransformed(x) {
    const fStr = els.fx.value;
    const mode = els.type.value;
    const p = parseFloat(els.p.value);
    const q = parseFloat(els.q.value);

    try {
      if (mode === 'vector') {
        let f_val = evaluateMath(fStr, x - p);
        return f_val !== null ? f_val + q : null;
      } else if (mode === 'symX') {
        let f_val = evaluateMath(fStr, x);
        return f_val !== null ? -f_val : null;
      } else if (mode === 'symY') {
        return evaluateMath(fStr, -x);
      } else if (mode === 'sym00') {
        let f_val = evaluateMath(fStr, -x);
        return f_val !== null ? -f_val : null;
      } else if (mode === 'absF') {
        let f_val = evaluateMath(fStr, x);
        return f_val !== null ? Math.abs(f_val) : null;
      } else if (mode === 'absX') {
        return evaluateMath(fStr, Math.abs(x));
      }
    } catch(e) {}
    return null;
  }

  function analyzeProperties() {
    // Czyste, estetyczne wyświetlanie dziedziny i zbioru wartości
    els.propDomain.innerText = "D = ℝ";
    els.propRange.innerText = "ZW = ℝ";

    let oyVal = evaluateTransformed(0);
    els.propOy.innerText = (oyVal !== null && !isNaN(oyVal) && isFinite(oyVal)) ? oyVal.toFixed(1).replace(/\.?0+$/, '') : "brak";

    let zeroVal = null;
    for (let x = -50; x <= 50; x += 0.1) {
      let y1 = evaluateTransformed(x);
      let y2 = evaluateTransformed(x + 0.1);
      if (y1 !== null && y2 !== null && Math.sign(y1) !== Math.sign(y2)) {
        zeroVal = x;
        break;
      } else if (y1 !== null && Math.abs(y1) < 0.01) {
        zeroVal = x;
        break;
      }
    }
    els.propZero.innerText = zeroVal !== null ? zeroVal.toFixed(1).replace(/\.?0+$/, '') : "brak";

    let y_test1 = evaluateTransformed(0);
    let y_test2 = evaluateTransformed(1);
    if (y_test1 !== null && y_test2 !== null) {
      if (y_test2 > y_test1) els.propMono.innerText = "Rosnąca";
      else if (y_test2 < y_test1) els.propMono.innerText = "Malejąca";
      else els.propMono.innerText = "Stała";
    } else {
      els.propMono.innerText = "Zmienna";
    }
  }

  function drawGrid() {
    resizeCanvasToDisplay();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const step = 1; 
    
    ctx.strokeStyle = '#2a2d3a';
    ctx.lineWidth = 1;
    
    let startX = Math.floor(-view.offsetX / view.scale / step) * step;
    let endX = Math.ceil((canvas.width - view.offsetX) / view.scale / step) * step;
    
    for(let i = startX; i <= endX; i += step) {
      let px = view.offsetX + i * view.scale;
      ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, canvas.height); ctx.stroke();
    }

    let startY = Math.floor(-(canvas.height - view.offsetY) / view.scale / step) * step;
    let endY = Math.ceil(view.offsetY / view.scale / step) * step;

    for(let i = startY; i <= endY; i += step) {
      let py = view.offsetY - i * view.scale;
      ctx.beginPath(); ctx.moveTo(0, py); ctx.lineTo(canvas.width, py); ctx.stroke();
    }
    
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, view.offsetY); ctx.lineTo(canvas.width, view.offsetY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(view.offsetX, 0); ctx.lineTo(view.offsetX, canvas.height); ctx.stroke();

    if (canvas.width > 150 && view.scale >= 15) {
      ctx.fillStyle = '#aaaaaa';
      ctx.font = '10px system-ui';
      
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      for(let i = startX; i <= endX; i += step) {
        if (i !== 0) ctx.fillText(i, view.offsetX + i * view.scale, Math.min(Math.max(view.offsetY + 4, 5), canvas.height - 15));
      }
      
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      for(let i = startY; i <= endY; i += step) {
        if (i !== 0) ctx.fillText(i, Math.min(Math.max(view.offsetX - 6, 15), canvas.width - 5), view.offsetY - i * view.scale);
      }
      
      ctx.textAlign = 'right'; ctx.textBaseline = 'top';
      ctx.fillText('0', view.offsetX - 4, view.offsetY + 4);
    }
  }

  function drawGraph() {
    drawGrid();
    const fStr = els.fx.value;

    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';

    if (currentAppMode === 'calc') {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
      ctx.setLineDash([4, 4]);
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      let firstPointF = true;
      for(let px = 0; px <= canvas.width; px += 2) {
        let x = (px - view.offsetX) / view.scale;
        let y = evaluateMath(fStr, x);
        if(y !== null && !isNaN(y) && isFinite(y)) {
          let py = view.offsetY - y * view.scale;
          if (firstPointF || py < -5000 || py > 5000) { ctx.moveTo(px, py); firstPointF = false; } 
          else ctx.lineTo(px, py);
        } else { firstPointF = true; }
      }
      ctx.stroke();
    }

    ctx.strokeStyle = '#3b82f6';
    ctx.setLineDash([]);
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    let firstPointG = true;
    
    for(let px = 0; px <= canvas.width; px += 2) {
      let x = (px - view.offsetX) / view.scale;
      let y = currentAppMode === 'calc' ? evaluateTransformed(x) : evaluateMath(currentSketchTask.formula, x);

      if(y !== null && !isNaN(y) && isFinite(y)) {
        let py = view.offsetY - y * view.scale;
        if (firstPointG || py < -5000 || py > 5000) { ctx.moveTo(px, py); firstPointG = false; } 
        else { ctx.lineTo(px, py); }
      } else { firstPointG = true; }
    }
    ctx.stroke();
  }

  function updateUI() {
    if (currentAppMode === 'calc') {
      const p = parseFloat(els.p.value);
      const q = parseFloat(els.q.value);
      els.pVal.innerText = p;
      els.qVal.innerText = q;
      analyzeProperties();
    }
    drawGraph();
  }

  function generateNewSketchTask() {
    const tasks = [
      { text: "Naszkicuj wykres funkcji g(x) = x - 2", formula: "x - 2", zero: "2", oy: "-2" },
      { text: "Naszkicuj wykres funkcji g(x) = x + 3", formula: "x + 3", zero: "-3", oy: "3" },
      { text: "Naszkicuj wykres funkcji g(x) = -x + 4", formula: "-x + 4", zero: "4", oy: "4" },
      { text: "Naszkicuj wykres funkcji g(x) = 2x - 4", formula: "2*x - 4", zero: "2", oy: "-4" }
    ];
    currentSketchTask = tasks[Math.floor(Math.random() * tasks.length)];
    els.sketchTaskText.innerText = "Zadanie: " + currentSketchTask.text;
    els.sketchZero.value = "";
    els.sketchOy.value = "";
    els.sketchFeedback.style.display = "none";
    drawGraph();
  }

  function checkSketchAnswer() {
    const userZero = els.sketchZero.value.trim().replace(',', '.');
    const userOy = els.sketchOy.value.trim().replace(',', '.');

    let correctZero = currentSketchTask.zero;
    let correctOy = currentSketchTask.oy;

    if (userZero === correctZero && userOy === correctOy) {
      els.sketchFeedback.innerText = "🎉 Dobra robota! Własności odczytane poprawnie!";
      els.sketchFeedback.className = "sketch-feedback success";
    } else {
      els.sketchFeedback.innerText = `❌ Błąd. Prawidłowe miejsce zerowe: ${correctZero}, punkt OY: ${correctOy}`;
      els.sketchFeedback.className = "sketch-feedback error";
    }
    els.sketchFeedback.style.display = "block";
  }

  function zoomByFactor(factor) {
    const centerX = canvas.width / 2, centerY = canvas.height / 2;
    view.offsetX = centerX - (centerX - view.offsetX) * factor;
    view.offsetY = centerY - (centerY - view.offsetY) * factor;
    view.scale *= factor;
    if(view.scale < 10) view.scale = 10;
    if(view.scale > 200) view.scale = 200;
    drawGraph();
  }

  canvas.addEventListener('mousedown', (e) => { isDragging = true; lastX = e.clientX; lastY = e.clientY; });
  canvas.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    view.offsetX += (e.clientX - lastX); view.offsetY += (e.clientY - lastY);
    lastX = e.clientX; lastY = e.clientY;
    drawGraph();
  });
  window.addEventListener('mouseup', () => { isDragging = false; });

  els.btnZoomIn.addEventListener('click', (e) => { e.stopPropagation(); zoomByFactor(1.35); });
  els.btnZoomOut.addEventListener('click', (e) => { e.stopPropagation(); zoomByFactor(1 / 1.35); });
  els.btnCenter.addEventListener('click', (e) => {
    e.stopPropagation();
    view.offsetX = canvas.width / 2; view.offsetY = canvas.height / 2; view.scale = 30;
    drawGraph();
  });

  function toggleFullscreen() {
    document.body.classList.toggle('fullscreen-mode');
    setTimeout(() => {
      view.offsetX = canvas.width / 2; view.offsetY = canvas.height / 2;
      drawGraph();
    }, 50);
  }

  els.btnFullscreen.addEventListener('click', toggleFullscreen);
  els.btnExitFs.addEventListener('click', toggleFullscreen);

  [els.fx, els.type, els.p, els.q].forEach(el => el.addEventListener('input', updateUI));
  els.type.addEventListener('change', updateUI); 

  window.addEventListener('resize', drawGraph);

  resizeCanvasToDisplay();
  view.offsetX = canvas.width / 2;
  view.offsetY = canvas.height / 2;
  updateUI();
</script>
</body>
</html>
